<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Объекты — График смен</title>
<link rel="stylesheet" href="assets/styles.css">
<script>(function(){try{var t=localStorage.getItem("grafik_theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
</head>
<body>
<header class="top" id="hdr"></header>
<main class="wrap"><div id="view"><div class="loading">Загрузка графика…</div></div></main>
<div id="modal-root"></div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/page-objects.js"></script>
<script>
(function(){
  var v=document.getElementById('view');
  if(window.GRAFIK_READY)return;
  document.documentElement.setAttribute('data-broken','1');
  v.innerHTML='<div style="max-width:720px;margin:60px auto;padding:24px;border:1px solid #E6E5E3;border-radius:14px;'+
    'font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#2C2C2B;background:#fff">'+
    '<h2 style="margin:0 0 10px">Файлы сайта не загрузились</h2>'+
    '<p>Страница открылась, но рядом с ней нет папки <b>assets</b> (в ней дизайн и код). '+
    'Поэтому график не может нарисоваться.</p>'+
    '<p><b>Что сделать:</b> загрузите на хостинг все файлы из архива целиком: '+
    'index.html и остальные .html — в корень, а папку assets — рядом с ними (со всеми 9 файлами внутри).</p>'+
    '<p style="color:#7D7A75;font-size:13px">Загружать сам zip-архив нельзя — хостинг не распакует его сам.</p></div>';
})();
</script>
</body>
</html>
